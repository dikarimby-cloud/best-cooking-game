<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dapur Kilat — Warung Rush</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23f2a541'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle'%3E%F0%9F%8D%9C%3C/text%3E%3C/svg%3E" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #241408; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Dapur Kilat: a fast warung cooking game. Move with WASD or arrows, or click. Press E to take, chop, cook, plate and serve."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
